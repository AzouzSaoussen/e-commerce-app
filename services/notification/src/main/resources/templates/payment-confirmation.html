<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Confirmation</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f7f7f7; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 8px; padding: 20px; }
        h2 { color: #2e7d32; }
        p { font-size: 15px; color: #444; }
        .amount { font-weight: bold; color: #2e7d32; }
        .footer { margin-top: 20px; font-size: 13px; color: #777; }
    </style>
</head>
<body>
<div class="container">
    <h2>Payment Confirmation</h2>
    <p>Dear <span th:text="${customerName}">Customer</span>,</p>
    <p>We are pleased to inform you that we have received your payment of
        <span class="amount" th:text="${totalAmount}">100.00</span> for your order.</p>
    <p>Your order reference is: <strong th:text="${orderReference}">ORD-12345</strong>.</p>

    <p>Thank you for shopping with us! 🎉</p>

    <div class="footer">
        <p>This is an automated message, please do not reply.</p>
    </div>
</div>
</body>
</html>
